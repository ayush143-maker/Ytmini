name: Native Kotlin APK

on:
  push:
    branches: [Kotlin]
    paths:
      - 'android/**'
      - '.github/workflows/kotlin-apk.yml'
  workflow_dispatch:

# Keep each phase build separate so earlier APKs aren't silently replaced.
concurrency:
  group: kotlin-apk-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-native-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact phase commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build native debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace
      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: ayutube-kotlin-phase-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
