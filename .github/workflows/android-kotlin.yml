name: Android Kotlin APK

on:
  push:
    branches: [Aurix-to-Kotlin, Aurix-to-Kotlin-ui-polish, Ayutube-kotlin-ui2]
  workflow_dispatch:

concurrency:
  group: android-kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build release APKs
        run: gradle -p kotlin assembleRelease assembleReleaseSafe --stacktrace

      - name: Upload release APK (shrunk with R8)
        uses: actions/upload-artifact@v4
        with:
          name: ayutube-release-apk
          path: kotlin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK (no R8, fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ayutube-release-safe-apk
          path: kotlin/app/build/outputs/apk/releaseSafe/*.apk
          if-no-files-found: error
          retention-days: 30
